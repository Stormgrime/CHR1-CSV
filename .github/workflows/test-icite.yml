name: Test iCite access

on:
  push:
    paths:
      - '.github/workflows/test-icite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query iCite with references
        run: python scripts/test_icite.py
      - name: Commit response
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          mv test_icite.json output/test_icite.json
          git add output/test_icite.json
          git commit -m "Update temporary iCite test response" || exit 0
          git push
