name: CalorType citation expansion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calortype-citations.yml"
      - "calortype_citations/retrieve.py.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish start pointer
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
        run: |
          mkdir -p calortype_results
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "source_sha": os.environ["RUN_SHA"],
              "phase": "started",
          }
          Path("calortype_results/run_info.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calortype_results/run_info.json
          git commit -m "Publish CalorType citation run start"
          git pull --rebase
          git push

      - name: Decode retrieval script
        run: base64 -d calortype_citations/retrieve.py.b64 > calortype_citations/retrieve.py

      - name: Build citation network
        run: python calortype_citations/retrieve.py

      - name: Upload citation network
        uses: actions/upload-artifact@v4
        with:
          name: calortype-crossrefs-set2
          path: out/
          retention-days: 7
          if-no-files-found: error

      - name: Publish completion pointer
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p calortype_results
          if [ -f out/summary.json ]; then cp out/summary.json calortype_results/summary.json; fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "source_sha": os.environ["RUN_SHA"],
              "phase": "finished",
              "job_status": os.environ.get("JOB_STATUS", ""),
          }
          Path("calortype_results/run_info.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calortype_results/run_info.json
          if [ -f calortype_results/summary.json ]; then git add calortype_results/summary.json; fi
          git commit -m "Publish CalorType citation run completion" || exit 0
          git pull --rebase
          git push
