name: CalorType citation expansion — sharded G2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calortype-citations.yml"
      - "calortype_citations/retrieve_sharded.py.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish run pointer
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
        run: |
          mkdir -p calortype_results
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "source_sha": os.environ["RUN_SHA"],
              "mode": "g2-sharded",
              "phase": "started",
          }
          Path("calortype_results/run_info.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calortype_results/run_info.json
          git commit -m "Publish sharded CalorType G2 run start" || exit 0
          git pull --rebase
          git push

  shard:
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Decode retriever
        run: |
          base64 -d calortype_citations/retrieve_sharded.py.b64 > calortype_citations/retrieve_sharded.py
          python -m py_compile calortype_citations/retrieve_sharded.py
      - name: Retrieve citation shard
        env:
          MODE: g2
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
        run: python calortype_citations/retrieve_sharded.py
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: calortype-g2-shard-${{ matrix.shard }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  finalize:
    if: always()
    needs: [announce, shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish completion pointer
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          MATRIX_RESULT: ${{ needs.shard.result }}
        run: |
          mkdir -p calortype_results
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "source_sha": os.environ["RUN_SHA"],
              "mode": "g2-sharded",
              "phase": "finished",
              "matrix_result": os.environ.get("MATRIX_RESULT", ""),
          }
          Path("calortype_results/run_info.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calortype_results/run_info.json
          git commit -m "Publish sharded CalorType G2 run completion" || exit 0
          git pull --rebase
          git push
