name: CalorType citation snowball

on:
  push:
    paths:
      - 'calortype_citations/**'
      - '.github/workflows/calortype-citations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build citation network
        run: python calortype_citations/citation_snowball.py
      - name: Upload raw network
        uses: actions/upload-artifact@v4
        with:
          name: calortype-crossreferences
          path: results/
          retention-days: 7
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m "Generate CalorType set-2 citation network"
            git push
          fi
