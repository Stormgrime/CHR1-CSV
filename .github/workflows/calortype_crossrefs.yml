name: Temporary CalorType cross-reference expansion

on:
  push:
    paths:
      - 'tmp_calortype/seed_set2.json'
      - 'tmp_calortype/calortype_crossrefs.py'
      - '.github/workflows/calortype_crossrefs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calortype-crossrefs-set2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build citation graph
        run: python tmp_calortype/calortype_crossrefs.py
      - name: Upload citation graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calortype-set2-crossrefs
          path: output/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
      - name: Publish run pointer
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p tmp_calortype/run
          python -c 'import json,os,pathlib,datetime; pathlib.Path("tmp_calortype/run/run.json").write_text(json.dumps({"run_id":int(os.environ["RUN_ID"]),"run_attempt":int(os.environ["RUN_ATTEMPT"]),"run_sha":os.environ["RUN_SHA"],"job_status":os.environ["JOB_STATUS"],"published_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()},indent=2)+"\n")'
          if [ -f output/summary.json ]; then cp output/summary.json tmp_calortype/run/summary.json; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp_calortype/run/run.json tmp_calortype/run/summary.json 2>/dev/null || git add tmp_calortype/run/run.json
          git commit -m "Publish CalorType cross-reference run ${RUN_ID}" || exit 0
          git push
