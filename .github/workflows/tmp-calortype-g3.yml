name: Temporary CalorType G3 rebuild

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-calortype-g3.yml"
      - "tmp_calortype_g3/part*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-calortype-g3-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Publish run pointer
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp_calortype_g3_result
          printf '{"run_id":%s,"source_sha":"%s","status":"started"}\n' "$RUN_ID" "$RUN_SHA" > tmp_calortype_g3_result/run_info.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_calortype_g3_result/run_info.json
          git commit -m "Publish temporary CalorType G3 run pointer ${RUN_ID}"
          git push

      - name: Assemble and decode script
        run: |
          cat tmp_calortype_g3/part0 tmp_calortype_g3/part1 tmp_calortype_g3/part2 tmp_calortype_g3/part3 > tmp_calortype_g3/retrieve.py.b64
          base64 -d tmp_calortype_g3/retrieve.py.b64 > tmp_calortype_g3/retrieve.py
          python -m py_compile tmp_calortype_g3/retrieve.py

      - name: Retrieve generation 3
        run: python tmp_calortype_g3/retrieve.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: tmp-calortype-g3-rebuild
          path: out_g3/
          retention-days: 1
          if-no-files-found: error

      - name: Publish completion pointer
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          if [ -f out_g3/g3_summary.json ]; then
            STATUS=success
            cp out_g3/g3_summary.json tmp_calortype_g3_result/summary.json
          else
            STATUS=failure
          fi
          printf '{"run_id":%s,"source_sha":"%s","status":"%s"}\n' "$RUN_ID" "$RUN_SHA" "$STATUS" > tmp_calortype_g3_result/run_info.json
          git add tmp_calortype_g3_result/
          if ! git diff --cached --quiet; then
            git commit -m "Publish temporary CalorType G3 completion ${RUN_ID}"
            git push
          fi
