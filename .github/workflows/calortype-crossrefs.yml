name: Build CalorType set 2 cross-references

on:
  push:
    paths:
      - '.github/workflows/calortype-crossrefs.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calortype-set2-crossrefs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the result is already published
        id: gate
        run: |
          set -euo pipefail
          git fetch origin main
          if git cat-file -e origin/main:output/calortype_crossrefs_set2_transfer/COMPLETE 2>/dev/null; then
            echo "run_needed=false" >> "$GITHUB_OUTPUT"
            echo "A complete result is already present; skipping."
          else
            echo "run_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run_needed == 'true'
        with:
          python-version: '3.12'

      - name: Decode and validate citation builder
        if: steps.gate.outputs.run_needed == 'true'
        run: |
          set -euo pipefail
          base64 --decode scripts/build_calortype_crossrefs.py.gz.b64 | gzip --decompress > /tmp/build_calortype_crossrefs.py
          python -m py_compile /tmp/build_calortype_crossrefs.py
          wc -l /tmp/build_calortype_crossrefs.py

      - name: Build two full generations and selective third generation
        if: steps.gate.outputs.run_needed == 'true'
        run: python /tmp/build_calortype_crossrefs.py

      - name: Upload citation graph bundle
        if: steps.gate.outputs.run_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calortype-crossrefs-set2
          path: |
            output/calortype_crossrefs_set2_bundle.zip
            output/calortype_crossrefs_set2/summary.json
            output/calortype_crossrefs_set2/ranked_candidates.csv
            output/calortype_crossrefs_set2/seed_summary.csv
            output/calortype_crossrefs_set2/METHODOLOGY.txt
          if-no-files-found: error
          retention-days: 7

      - name: Stage temporary downloadable transfer files
        if: steps.gate.outputs.run_needed == 'true'
        run: |
          set -euo pipefail
          transfer=output/calortype_crossrefs_set2_transfer
          rm -rf "$transfer"
          mkdir -p "$transfer"
          cp output/calortype_crossrefs_set2/summary.json "$transfer/"
          cp output/calortype_crossrefs_set2/ranked_candidates.csv "$transfer/"
          cp output/calortype_crossrefs_set2/seed_summary.csv "$transfer/"
          cp output/calortype_crossrefs_set2/METHODOLOGY.txt "$transfer/"
          sha256sum output/calortype_crossrefs_set2_bundle.zip > "$transfer/bundle.sha256"
          split -b 45m -d -a 3 output/calortype_crossrefs_set2_bundle.zip "$transfer/bundle.part."
          find "$transfer" -maxdepth 1 -type f -printf '%f\n' | sort > "$transfer/FILES.txt"
          printf 'complete\n' > "$transfer/COMPLETE"
          ls -lh "$transfer"

      - name: Commit temporary transfer files
        if: steps.gate.outputs.run_needed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add output/calortype_crossrefs_set2_transfer
          git commit -m "Publish temporary CalorType set 2 cross-reference results"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            sleep 5
            git pull --rebase origin main
          done
          exit 1
