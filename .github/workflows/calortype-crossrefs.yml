name: Build CalorType set 2 cross-references

on:
  push:
    paths:
      - '.github/workflows/calortype-crossrefs.yml'
  workflow_dispatch:

concurrency:
  group: calortype-set2-crossrefs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish running marker
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          marker = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha": os.environ["RUN_SHA"],
              "job_status": "running",
              "run_url": os.environ["RUN_URL"],
              "updated_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          path = f"output/calortype_set2_run_{os.environ['RUN_ID']}.json"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(marker, fh, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/calortype_set2_run_${RUN_ID}.json"
          git commit -m "Start CalorType citation workflow run ${RUN_ID}"
          git push
      - name: Tune batch sizes
        run: |
          sed -i 's/ICITE_BATCH = 100/ICITE_BATCH = 300/' scripts/build_calortype_crossrefs.py
          sed -i 's/MAX_G3_FRONTIER = 3_000/MAX_G3_FRONTIER = 2_500/' scripts/build_calortype_crossrefs.py
      - name: Expand and rank citation graph
        run: python scripts/build_calortype_crossrefs.py
      - name: Upload cross-reference bundle
        uses: actions/upload-artifact@v4
        with:
          name: calortype-set2-crossrefs
          path: output/calortype_set2_crossrefs_bundle.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish completion marker
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git pull --rebase
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          marker = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha": os.environ["RUN_SHA"],
              "job_status": os.environ["RUN_STATUS"],
              "run_url": os.environ["RUN_URL"],
              "updated_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          path = f"output/calortype_set2_run_{os.environ['RUN_ID']}.json"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(marker, fh, indent=2)
          PY
          git add "output/calortype_set2_run_${RUN_ID}.json"
          git commit -m "Complete CalorType citation workflow run ${RUN_ID}" || exit 0
          git push
