name: Build CalorType set 2 cross-references

on:
  push:
    paths:
      - '.github/workflows/calortype-crossrefs.yml'
  workflow_dispatch:

concurrency:
  group: calortype-set2-crossrefs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish running marker
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          marker = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha": os.environ["RUN_SHA"],
              "job_status": "running",
              "run_url": os.environ["RUN_URL"],
              "updated_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          path = f"output/calortype_set2_run_{os.environ['RUN_ID']}.json"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(marker, fh, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/calortype_set2_run_${RUN_ID}.json"
          git commit -m "Start optimised CalorType citation workflow run ${RUN_ID}"
          git push

      - name: Decode optimised expansion job
        shell: bash
        run: |
          base64 -d tmp/calortype_job_payload_20260824.tar.gz.b64 | tar -xz
          python -m py_compile scripts/calortype_citation_expand.py

      - name: Expand and rank citation graph
        env:
          GEN3_PARENT_CAP: '2500'
          GEN3_METADATA_CAP: '40000'
          ABSTRACT_CAP: '8000'
          RUN_MARKER: 'output/embedded_citation_run.json'
        run: python scripts/calortype_citation_expand.py

      - name: Package result files
        shell: bash
        run: zip -9 -r calortype_set2_crossrefs.zip artifact

      - name: Upload cross-reference bundle
        uses: actions/upload-artifact@v4
        with:
          name: calortype-set2-crossrefs
          path: calortype_set2_crossrefs.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish completion marker
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git pull --rebase
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          marker = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha": os.environ["RUN_SHA"],
              "job_status": os.environ["RUN_STATUS"],
              "run_url": os.environ["RUN_URL"],
              "updated_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          path = f"output/calortype_set2_run_{os.environ['RUN_ID']}.json"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(marker, fh, indent=2)
          PY
          git add "output/calortype_set2_run_${RUN_ID}.json"
          git commit -m "Complete optimised CalorType citation workflow run ${RUN_ID}" || exit 0
          git push
