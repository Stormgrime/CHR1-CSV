name: Build CalorType set 2 cross-references

on:
  push:
    paths:
      - '.github/workflows/calortype-crossrefs.yml'
  workflow_dispatch:

concurrency:
  group: calortype-set2-crossrefs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish running marker
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          marker = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha": os.environ["RUN_SHA"],
              "job_status": "running",
              "run_url": os.environ["RUN_URL"],
              "updated_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          path = f"output/calortype_set2_run_{os.environ['RUN_ID']}.json"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(marker, fh, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/calortype_set2_run_${RUN_ID}.json"
          git commit -m "Start CalorType citation workflow run ${RUN_ID} [skip ci]"
          git push

      - name: Verify and unpack expansion job
        shell: bash
        run: |
          cat tmp/calortype_payload_20260824.part.* > /tmp/calortype_payload.b64
          echo "4626880fe944efa8cf87145f03b459b8d22cc8d89dab27bef523497985d04eea  /tmp/calortype_payload.b64" | sha256sum -c -
          base64 -d /tmp/calortype_payload.b64 > /tmp/calortype_payload.tar.gz
          tar -xzf /tmp/calortype_payload.tar.gz
          python -m py_compile scripts/calortype_expand.py

      - name: Expand and rank citation graph
        env:
          GEN3_PARENT_CAP: '3000'
          GEN3_METADATA_CAP: '40000'
          ABSTRACT_CAP: '8000'
        run: python scripts/calortype_expand.py

      - name: Upload cross-reference bundle
        uses: actions/upload-artifact@v4
        with:
          name: calortype-set2-crossrefs
          path: artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Publish completion marker
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git pull --rebase
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          marker = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha": os.environ["RUN_SHA"],
              "job_status": os.environ["RUN_STATUS"],
              "run_url": os.environ["RUN_URL"],
              "updated_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          path = f"output/calortype_set2_run_{os.environ['RUN_ID']}.json"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(marker, fh, indent=2)
          PY
          git add "output/calortype_set2_run_${RUN_ID}.json"
          git commit -m "Complete CalorType citation workflow run ${RUN_ID} [skip ci]" || exit 0
          git push
